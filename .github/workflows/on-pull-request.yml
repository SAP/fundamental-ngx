name: PR checks

on:
    pull_request:
        types: [opened, synchronize, edited]

env:
    NODE_VERSION: '22.x'
    NX_CLOUD_DISTRIBUTED_EXECUTION: true
    NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT: 3
    NX_BRANCH: ${{ github.event.number || github.ref_name }}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    pr_title_lint:
        runs-on: ubuntu-latest
        name: Validate PR title
        permissions:
            contents: read
            pull-requests: read
            statuses: write
        steps:
            - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      docs
                      style
                      refactor
                      test
                      build
                      ci
                      chore
                  scopes: |
                      core
                      platform
                      docs
                      e2e
                      release
                      deps
                      deps-dev
                      changelog
                      ci
                      cx
                      btp
                      cdk
                      shared
                      i18n
                      datetime-adapter
                      moment-adapter
                      ui5
                      mcp
                      skills
                  requireScope: false
                  # Ensure breaking changes use correct format
                  # This validates the PR title when using GitHub's squash merge
                  validateSingleCommit: false
                  ignoreLabels: |
                      ignore-semantic-pull-request

    pr_body_lint:
        runs-on: ubuntu-latest
        name: Validate PR body breaking change format
        permissions:
            contents: read
            pull-requests: read
            issues: write
        steps:
            - name: Check PR body for breaking change footer typos
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.pull_request.body || '';
                      const commentMarker = '<!-- breaking-change-footer-lint -->';

                      async function upsertGuidanceComment(message) {
                          const comments = await github.paginate(github.rest.issues.listComments, {
                              ...context.repo,
                              issue_number: context.issue.number,
                              per_page: 100
                          });

                          const existingComment = comments.find((comment) => comment.body?.includes(commentMarker));
                          const commentBody = `${commentMarker}\n❌ ${message}\n\nUse this exact footer format:\n\n\`\`\`\nBREAKING CHANGE: <description>\n\`\`\``;

                          if (existingComment) {
                              await github.rest.issues.updateComment({
                                  ...context.repo,
                                  comment_id: existingComment.id,
                                  body: commentBody
                              });
                              return;
                          }

                          await github.rest.issues.createComment({
                              ...context.repo,
                              issue_number: context.issue.number,
                              body: commentBody
                          });
                      }

                      const candidateFooterPattern = /^[ \t>*-]*breaking[ \t_-]*changes?[ \t]*:/im;
                      const candidateFooterTokenPattern = /breaking[ \t_-]*changes?[ \t]*:/i;

                      if (!candidateFooterPattern.test(body)) {
                          core.info('✓ No breaking change footer found in PR body');
                          return;
                      }

                      for (const line of body.split(/\r?\n/)) {
                          if (!candidateFooterPattern.test(line)) {
                              continue;
                          }

                          const token = line.match(candidateFooterTokenPattern)?.[0] ?? line.trim();
                          if (line !== 'BREAKING CHANGE:' && !line.startsWith('BREAKING CHANGE: ')) {
                              const errorMessage =
                                  `PR body contains "${token}" but must use "BREAKING CHANGE:" exactly (singular, uppercase, one space, no prefix). ` +
                                  `This matters when using GitHub's squash merge - the PR body becomes the commit footer.`;

                              await upsertGuidanceComment(errorMessage);
                              core.setFailed(errorMessage);
                              return;
                          }
                      }

                      core.info('✓ Breaking change footer format is correct');

    nx_agents:
        name: Nx Cloud Agent ${{ matrix.agent }}
        runs-on: ubuntu-latest
        environment: ci
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            matrix:
                agent: [1, 2, 3]
        steps:
            - uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 1 # Shallow clone for agents (they don't need git history)
            - uses: ./.github/actions/nodejs
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: set up xvfb
              run: |
                  export DISPLAY=:99
                  sudo Xvfb -ac :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
            - name: Start Nx Cloud Agent
              run: npx nx-cloud start-agent
              env:
                  NX_AGENT_NAME: ${{matrix.agent}}

    build_test:
        runs-on: ubuntu-latest
        name: Run affected Build, Lint and test commands
        environment: ci
        env:
            NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}
        permissions:
            contents: read
            pull-requests: read
        defaults:
            run:
                working-directory: ${{ github.workspace }}
                shell: bash
        steps:
            - uses: actions/checkout@v4.2.2
              name: Checkout
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - uses: nrwl/nx-set-shas@v5.0.1
              name: Derive appropriate SHAs for base and head for nx-affected commands
              with:
                  main-branch-name: main

            - uses: ./.github/actions/nodejs
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Initialize the Nx Cloud distributed CI run
              run: npx nx-cloud start-ci-run

            - name: Format Check
              run: npx prettier . --check
              env:
                  NX_CLOUD_DISTRIBUTED_EXECUTION: false

            - uses: wagoid/commitlint-github-action@v6.1.2
              name: Commit lint

            - name: Generate ui5-webcomponents wrappers
              run: npx nx run-many --target=generate --projects=ui5-webcomponents,ui5-webcomponents-ai,ui5-webcomponents-fiori,ui5-webcomponents-base
              env:
                  NX_CLOUD_DISTRIBUTED_EXECUTION: false

            - name: Run Build, Lint and test commands
              uses: ./.github/actions/parallel-commands
              with:
                  parallel-commands: |
                      npx nx affected --target=build --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --exclude=docs,e2e-harness --parallel=1
                      npx nx run-many --target=test --all --skip-nx-cache --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --exclude=nx-plugin --parallel=1
                      npx nx affected --target=lint --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD --exclude=core,platform,cx,btp --parallel=1

            - name: Build e2e-harness (non-DTE; needs generated ui5 sources locally)
              run: npx nx run e2e-harness:build:development
              env:
                  NX_CLOUD_DISTRIBUTED_EXECUTION: false

            - name: Text workspace tags
              run: npx nx run nx-plugin:test --skip-nx-cache

            # Stop NX Cloud agents immediately if any step fails
            # This prevents agents from running indefinitely when the main job fails
            - name: Stop Nx Cloud agents on failure
              if: failure()
              run: npx --yes nx-cloud@latest stop-all-agents
              env:
                  NX_CLOUD_AUTH_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}

