<div
    class="fd-side-panel__action-bar"
    role="toolbar"
    aria-orientation="vertical"
    [attr.aria-label]="ariaLabel()"
    (keydown)="_onKeydown($event)"
>
    <div class="fd-side-panel__action-container">
        <button
            type="button"
            class="fd-side-panel__nav-arrow"
            [attr.aria-expanded]="open()"
            [attr.aria-label]="open() ? 'Collapse side panel' : 'Expand side panel'"
            [attr.title]="open() ? 'Collapse side panel' : 'Expand side panel'"
            (click)="_toggleOpen()"
        >
            <fd-icon [glyph]="_navArrowIcon()" [ariaHidden]="true" />
        </button>
    </div>

    @for (item of _items(); track item.id(); let i = $index) {
        <div class="fd-side-panel__action-container" (click)="_activate(item, i)">
            <button
                #actionButton
                type="button"
                class="fd-side-panel__action"
                [class.is-active]="item.id() === activeItem()"
                [class.is-disabled]="item.disabled()"
                [attr.aria-pressed]="item.id() === activeItem()"
                [attr.aria-label]="item.label()"
                [attr.aria-disabled]="item.disabled() || null"
                [attr.title]="item.label()"
                [disabled]="item.disabled()"
                [tabindex]="i === _focusedIndex() ? 0 : -1"
            >
                <fd-icon class="fd-side-panel__action-icon" [glyph]="item.icon()" [ariaHidden]="true" />
            </button>
        </div>
    }
</div>
