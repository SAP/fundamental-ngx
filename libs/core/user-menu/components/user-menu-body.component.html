@if (!submenu()) {
    <ng-content select="[fd-user-menu-header]"></ng-content>
    <ng-content select="[fd-user-menu-content-container]"></ng-content>
} @else {
    <div class="fd-user-menu__details-view">
        <ng-container *ngTemplateOutlet="submenu()"></ng-container>
    </div>
}

<ng-template #bodyHeader let-dialogRef="dialogRef">
    <div fd-bar class="fd-user-menu__mobile-header">
        @if (submenu()) {
            <div fd-bar-left>
                <fd-bar-element>
                    <fd-button-bar
                        fdkInitialFocus
                        [ariaLabel]="('coreUserMenu.previousButton' | fdTranslate)()"
                        [glyph]="navigationArrow()"
                        (click)="clearSubmenu()"
                    >
                    </fd-button-bar>
                </fd-bar-element>
                <fd-bar-element>
                    <h5 fd-title>{{ selectedItemTitle() }}</h5>
                </fd-bar-element>
            </div>
        }
        <div fd-bar-right>
            @if (!submenu()) {
                <fd-bar-element
                    [fullWidth]="true"
                    class="fd-user-menu__scroll-header-element"
                    [class.hidden]="isUserNameVisible()"
                    role="presentation"
                    aria-hidden="true"
                >
                    <div
                        [innerHTML]="userNameContent()"
                        class="fd-user-menu__user-name fd-user-menu__user-name--truncate fd-user-menu__mobile-user-name"
                    ></div>
                </fd-bar-element>
            }

            <fd-bar-element>
                <fd-button-bar
                    [ariaLabel]="('coreUserMenu.closeButton' | fdTranslate)()"
                    glyph="decline"
                    (click)="closeDialog(dialogRef)"
                >
                </fd-button-bar>
            </fd-bar-element>
        </div>
    </div>
</ng-template>
