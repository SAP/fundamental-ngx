<h3>Read-only Checkbox (Template Driven Form)</h3>
<fdp-form-group [noLabelLayout]="false">
    <fdp-form-field id="readonly-ngmodel" [noLabelLayout]="true" [rank]="4" [editable]="true">
        <fdp-checkbox name="readonly-ngmodel-cb" label="Read-only" [readonly]="true" [(ngModel)]="ngModelChecked">
        </fdp-checkbox>
    </fdp-form-field>
</fdp-form-group>
<div [style.padding-left.rem]="2">
    <div>Value: {{ ngModelChecked }}</div>
</div>
<br />

<h3>Read-only Checkbox (Reactive Form)</h3>
<form [formGroup]="readonlyForm">
    <fdp-form-group [noLabelLayout]="false">
        <fdp-form-field id="readonly-reactive" [noLabelLayout]="true" [rank]="4" [editable]="true">
            <fdp-checkbox name="readonly-reactive-cb" label="Read-only" [readonly]="true" formControlName="checkbox">
            </fdp-checkbox>
        </fdp-form-field>
    </fdp-form-group>
</form>
<div [style.padding-left.rem]="2">
    <div>Value: {{ readonlyForm.controls.checkbox.value }}</div>
    <div>Dirty: {{ readonlyForm.dirty }}</div>
</div>
