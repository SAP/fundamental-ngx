<fdp-icon-tab-bar
    iconTabType="process"
    maxContentHeight="220px"
    [stackContent]="true"
    (iconTabSelected)="setLastSelected($event)"
>
    @for (step of steps; track step.id) {
        <fdp-icon-tab-bar-tab [label]="step.label" [active]="step.id === 'step-2'">
            <div class="stack-content-panel">
                @for (i of rows; track i) {
                    <p class="stack-content-row">{{ step.label }} — row {{ i }}</p>
                }
            </div>
        </fdp-icon-tab-bar-tab>
    }
</fdp-icon-tab-bar>
