<p>Click the button to display the message view with different message types:</p>

<button
    fd-button
    type="button"
    label="Show Message View"
    (click)="messageView.open()"
    class="fd-margin-end--sm"
></button>
<button fd-button type="button" label="Show Mobile Message View" (click)="mobileMessageView.open()"></button>

<fdp-message-view #messageView [messages]="messages()"></fdp-message-view>
<fdp-message-view #mobileMessageView [messages]="messages()" [mobile]="true"></fdp-message-view>

<ng-template #customDescriptionTemplate>
    <strong>This is a custom TemplateRef!</strong>
    <p>You can include any HTML content here, including custom styling and formatting.</p>
</ng-template>

<ng-template #literalMessageTemplate let-message>{{ message }}</ng-template>
