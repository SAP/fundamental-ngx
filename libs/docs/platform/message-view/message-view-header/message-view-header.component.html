<fd-doc-page>
    <header>Message View</header>

    <description>
        <p>
            Message View is a combination of components that renders errors in a human-readable list displayed in a
            dialog. You can use the message view to display messages that are not related to form or table fields. These
            messages are triggered in response to a user action.
        </p>
    </description>

    <import module="PlatformMessageViewModule" subPackage="message-view"></import>

    <fd-header-tabs></fd-header-tabs>
</fd-doc-page>
