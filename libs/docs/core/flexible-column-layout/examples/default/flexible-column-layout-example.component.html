<button fd-button (click)="enterFullscreenExample()">Click to open full screen</button>
<div cdkScrollable class="fd-docs-fcl-example-overlay" #overlay>
    @if (fullscreen) {
        <div class="fd-docs-fcl-example-overlay-content">
            <div class="fd-docs-fcl-example-button">
                <button fd-button (click)="exitFullscreenExample($event)">Exit Example</button>
            </div>
            <!-- Flexible Column Layout -->
            <fd-flexible-column-layout
                [(layout)]="localLayout"
                expandTitleStartBtn="Expand first column"
                collapseTitleStartBtn="Collapse first column"
                expandTitleEndBtn="Expand last column"
                collapseTitleEndBtn="Collapse last column"
            >
                <ng-template #startColumn>
                    <div class="fd-docs-fcl-example-section">
                        <h2>Start Column</h2>

                        <fd-layout-grid style="padding: 1rem">
                            <div fdLayoutGridRow>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="1"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="2"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="3"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="4"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="5"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="6"></fd-docs-fcl-grid-block>
                                </div>
                            </div>
                        </fd-layout-grid>
                        <div style="padding: 1rem">
                            <button class="fd-button" (click)="changeLayout('TwoColumnsStartExpanded')">
                                Open Column 2
                            </button>
                        </div>
                    </div>
                </ng-template>
                <ng-template #midColumn>
                    <div class="fd-docs-fcl-example-section">
                        <h2>Middle Column</h2>

                        <fd-layout-grid style="padding: 1rem">
                            <div fdLayoutGridRow>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="101"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="102"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="103"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="104"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="105"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="106"></fd-docs-fcl-grid-block>
                                </div>
                            </div>
                        </fd-layout-grid>
                        <div style="padding: 1rem">
                            <button class="fd-button" (click)="changeLayout('ThreeColumnsMidExpanded')">
                                Open Column 3
                            </button>
                        </div>
                    </div>
                </ng-template>
                <ng-template #endColumn>
                    <div class="fd-docs-fcl-example-section">
                        <h2>End Column</h2>

                        <fd-layout-grid style="padding: 1rem">
                            <div fdLayoutGridRow>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="201"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="202"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="203"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="204"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="205"></fd-docs-fcl-grid-block>
                                </div>
                                <div [fdLayoutGridCol]="12" [colMd]="6" [colLg]="4">
                                    <fd-docs-fcl-grid-block [itemNumber]="206"></fd-docs-fcl-grid-block>
                                </div>
                            </div>
                        </fd-layout-grid>
                        <div style="padding: 1rem">
                            <div>
                                @if (localLayout !== 'OneColumnEndFullScreen') {
                                    <button class="fd-button" (click)="changeLayout('OneColumnEndFullScreen')">
                                        Expand Column 3
                                    </button>
                                }
                                @if (localLayout !== 'OneColumnEndFullScreen') {
                                    <button class="fd-button" (click)="changeLayout('TwoColumnsMidExpanded')">
                                        Close Column 3
                                    </button>
                                }
                                @if (localLayout === 'OneColumnEndFullScreen') {
                                    <button class="fd-button" (click)="changeLayout('ThreeColumnsMidExpanded')">
                                        Exit Full Screen Column 3
                                    </button>
                                }
                            </div>
                        </div>
                    </div>
                </ng-template>
            </fd-flexible-column-layout>
        </div>
    }
</div>
