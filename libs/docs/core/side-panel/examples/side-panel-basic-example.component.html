<div class="side-panel-example">
    <fd-side-panel
        side="right"
        ariaLabel="Content groups"
        [activeItem]="activeItem()"
        (activeItemChange)="activeItem.set($event)"
    >
        <fd-side-panel-item id="filter" icon="filter" label="Filter">
            <ng-template fdSidePanelContent>Filter group content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="layout" icon="menu2" label="Layout">
            <ng-template fdSidePanelContent>Layout group content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="attachments" icon="attachment" label="Attachments">
            <ng-template fdSidePanelContent>Attachments group content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="comments" icon="comment" label="Comments">
            <ng-template fdSidePanelContent>Comments group content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="activity" icon="activity-items" label="Activity" [disabled]="true">
            <ng-template fdSidePanelContent>Activity group content</ng-template>
        </fd-side-panel-item>
    </fd-side-panel>
</div>
<p>Active group: {{ activeItem() ?? 'none' }}</p>
