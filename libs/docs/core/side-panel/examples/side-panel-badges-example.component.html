<div class="side-panel-example">
    <fd-side-panel
        side="right"
        ariaLabel="Notifications"
        [activeItem]="activeItem()"
        (activeItemChange)="activeItem.set($event)"
    >
        <fd-side-panel-item id="messages" icon="message-popup" label="Messages" [counter]="5">
            <ng-template fdSidePanelContent>Messages content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="alerts" icon="bell" label="Alerts" [counter]="3">
            <ng-template fdSidePanelContent>Alerts content</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="updates" icon="download" label="Updates" [counter]="142">
            <ng-template fdSidePanelContent>Updates content (counter capped at 99+)</ng-template>
        </fd-side-panel-item>
        <fd-side-panel-item id="tasks" icon="task" label="Tasks">
            <ng-template fdSidePanelContent>Tasks content</ng-template>
        </fd-side-panel-item>
    </fd-side-panel>
</div>
<p>Active group: {{ activeItem() ?? 'none' }}</p>
