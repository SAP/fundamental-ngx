<button fd-button label="Standard Button"></button>
<button fd-button label="Emphasized Button" fdType="emphasized"></button>
<button fd-button label="Ghost Button" fdType="ghost" [attr.aria-description]="ghostButtonAriaDescription"></button>
<button
    fd-button
    label="Positive Button"
    fdType="positive"
    ariaLabel="Positive"
    [attr.aria-description]="'This adds a new record'"
></button>
<button
    fd-button
    label="Negative Button"
    fdType="negative"
    ariaLabel="Negative"
    ariaDescription="This permanently deletes the record"
></button>
<button
    fd-button
    label="Attention Button"
    fdType="attention"
    ariaLabel="Attention"
    ariaTypeDescription="This requires immediate attention"
></button>
<button
    fd-button
    label="Transparent Button"
    fdType="transparent"
    ariaLabel="Transparent"
    aria-description="Transparent Button Description"
></button>
