<div style="display: flex; flex-direction: column; gap: 1.5rem">
    <div>
        <p style="margin-bottom: 0.5rem">Default (width-based) — {{ defaultContainerWidth() }}px</p>
        <fd-slider
            [min]="100"
            [max]="800"
            [ngModel]="defaultContainerWidth()"
            (ngModelChange)="defaultContainerWidth.set($event)"
            style="width: 800px; margin-bottom: 0.75rem"
        ></fd-slider>
        <div
            [style.width.px]="defaultContainerWidth()"
            style="border: 1px dashed var(--sapNeutralBorderColor, #ccc); padding: 4px; box-sizing: border-box"
        >
            <fd-avatar-group type="individual" size="m" overflowPopoverTitle="Team members" style="width: 100%">
                @for (person of people; track person) {
                    <fd-avatar
                        *fdAvatarGroupItem="''; title: person.firstName + ' ' + person.lastName"
                        [circle]="true"
                        [border]="true"
                        size="m"
                        role="img"
                        [title]="person.firstName + ' ' + person.lastName"
                        [label]="person.firstName[0] + person.lastName[0]"
                        [ariaLabel]="person.firstName + ' ' + person.lastName + ' avatar'"
                    ></fd-avatar>
                }
            </fd-avatar-group>
        </div>
    </div>

    <div>
        <p style="margin-bottom: 0.5rem"><code>[maxVisibleItems]="5"</code> — {{ maxItemsContainerWidth() }}px</p>
        <fd-slider
            [min]="100"
            [max]="800"
            [ngModel]="maxItemsContainerWidth()"
            (ngModelChange)="maxItemsContainerWidth.set($event)"
            style="width: 800px; margin-bottom: 0.75rem"
        ></fd-slider>
        <div
            [style.width.px]="maxItemsContainerWidth()"
            style="border: 1px dashed var(--sapNeutralBorderColor, #ccc); padding: 4px; box-sizing: border-box"
        >
            <fd-avatar-group
                type="individual"
                size="m"
                overflowPopoverTitle="Team members"
                [maxVisibleItems]="5"
                overflowButtonShape="circle"
                style="width: 100%"
            >
                @for (person of people; track person) {
                    <fd-avatar
                        *fdAvatarGroupItem="''; title: person.firstName + ' ' + person.lastName"
                        [circle]="true"
                        [border]="true"
                        size="m"
                        role="img"
                        [title]="person.firstName + ' ' + person.lastName"
                        [label]="person.firstName[0] + person.lastName[0]"
                        [ariaLabel]="person.firstName + ' ' + person.lastName + ' avatar'"
                    ></fd-avatar>
                }
            </fd-avatar-group>
        </div>
    </div>
</div>
