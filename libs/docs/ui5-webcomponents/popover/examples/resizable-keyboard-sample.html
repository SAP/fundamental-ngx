<ui5-button id="resizable-keyboard-popover-opener" design="Emphasized" (ui5Click)="_isOpen.set(true)">
    Open resizable popover
</ui5-button>

<ui5-popover
    opener="resizable-keyboard-popover-opener"
    headerText="Keyboard-resizable popover"
    resizable
    [open]="_isOpen()"
    (ui5Close)="_isOpen.set(false)"
    style="width: 24rem; min-width: 20rem; height: 18rem; min-height: 14rem"
>
    <p>
        After opening the Popover, press Tab to move focus to the resize handle, then use Shift+Arrow keys to resize by
        16 px per press.
    </p>
    <p>Use Shift+Right or Shift+Down to grow; Shift+Left or Shift+Up to shrink. Escape closes the popover.</p>
    <ui5-button design="Transparent" (ui5Click)="_isOpen.set(false)">Close popover</ui5-button>
</ui5-popover>
