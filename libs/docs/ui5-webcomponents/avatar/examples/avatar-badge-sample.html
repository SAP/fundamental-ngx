@if (iconsLoaded()) {
<section aria-labelledby="avatar-badge-default">
    <h2 id="avatar-badge-default">Badge with Icon</h2>
    <ui5-avatar initials="AB" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="edit" tooltip="Edit"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="CD" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="camera" tooltip="Camera"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar icon="employee" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="add" tooltip="Add"></ui5-avatar-badge>
    </ui5-avatar>
</section>

<section aria-labelledby="avatar-badge-tooltip">
    <h2 id="avatar-badge-tooltip">Custom Tooltip</h2>
    <ui5-avatar initials="AB" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="edit" tooltip="Edit profile picture"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="CD" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="camera" tooltip="Upload new photo"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar icon="employee" size="L" shape="Circle" interactive>
        <ui5-avatar-badge slot="badge" icon="add" tooltip="Add team member"></ui5-avatar-badge>
    </ui5-avatar>
</section>

<section aria-labelledby="avatar-badge-states">
    <h2 id="avatar-badge-states">Badge States</h2>
    <ui5-avatar initials="AB" size="L" shape="Circle">
        <ui5-avatar-badge slot="badge" state="None" icon="edit" tooltip="Edit"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="CD" size="L" shape="Circle">
        <ui5-avatar-badge slot="badge" state="Positive" icon="accept" tooltip="Accepted"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="EF" size="L" shape="Circle">
        <ui5-avatar-badge slot="badge" state="Critical" icon="alert" tooltip="Warning"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="GH" size="L" shape="Circle">
        <ui5-avatar-badge slot="badge" state="Negative" icon="error" tooltip="Error"></ui5-avatar-badge>
    </ui5-avatar>
    <ui5-avatar initials="IJ" size="L" shape="Circle">
        <ui5-avatar-badge slot="badge" state="Information" icon="hint" tooltip="Information"></ui5-avatar-badge>
    </ui5-avatar>
</section>

<section aria-labelledby="avatar-badge-color-palette">
    <h2 id="avatar-badge-color-palette">Extended Color Palette</h2>
    @for (scheme of colorSchemes(); track scheme) {
    <ui5-avatar size="L" shape="Circle" mode="Decorative">
        <ui5-avatar-badge slot="badge" [colorScheme]="scheme" icon="employee" tooltip="Employee"></ui5-avatar-badge>
    </ui5-avatar>
    }
</section>
}
