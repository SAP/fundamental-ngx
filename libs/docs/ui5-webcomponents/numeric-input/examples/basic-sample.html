<div class="fddocs-container">
    <div class="fd-margin-bottom--sm">
        <ui5-label for="numeric-input-1" showColon>Default step (1)</ui5-label>
        <ui5-numeric-input
            class="fd-margin-begin--sm"
            id="numeric-input-1"
            [value]="value1()"
            (ui5Change)="onValueChange($event, value1)"
        />
    </div>

    <div class="fd-margin-bottom--sm">
        <ui5-label for="numeric-input-2" showColon>Custom step (5)</ui5-label>
        <ui5-numeric-input
            id="numeric-input-2"
            class="fd-margin-begin--sm"
            [value]="value2()"
            [step]="5"
            (ui5Change)="onValueChange($event, value2)"
        />
    </div>
</div>
